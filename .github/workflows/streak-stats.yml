name: Generate Streak Stats SVG

on:
  schedule:
    - cron: "0 3 * * *"   # runs daily at 3 AM UTC
  push:
    paths:
      - ".github/workflows/streak-stats.yml"
  workflow_dispatch:      # lets you trigger it manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate streak stats SVG
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          user_id: codewithtrisha09
          theme: tokyonight
          exclude_days: ""
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Move SVG into profile folder
        run: |
          mkdir -p profile
          mv github-readme-streak-stats.svg profile/streak.svg

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/streak.svg
          git commit -m "Update streak stats SVG" || echo "No changes to commit"
          git push
